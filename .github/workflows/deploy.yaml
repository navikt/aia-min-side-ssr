name: "Deploy dev&prod"
on:
  push:
    branches:
      - "main"
      - "dev/*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "test & build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86" # v6.0.10
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"

      - name: "Install dependencies"
        run: "pnpm ci"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: "Install playwright browsers"
        run: "pnpm exec playwright install chromium --with-deps"

      - name: "Run Biome lint"
        run: "pnpm lint:ci"

      - name: "Run tests"
        run: "pnpm test:ci"

      - name: Knip
        run: pnpm dlx knip --no-exit-code --reporter=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: "Build application"
        run: "pnpm build"
        env:
          ASTRO_KEY: ${{ secrets.ASTRO_KEY }}

      - name: "Build storybook"
        run: "pnpm build-storybook"

      - name: "Upload to cdn"
        uses: nais/deploy/actions/cdn-upload/v2@2d18f050f07b6a007864c6a57070ed915d571beb # v2
        with:
          team: paw
          source: ./dist/client/_astro
          destination: "aia-min-side-ssr"

      - name: "Build and push"
        uses: nais/docker-build-push@2d2b0a7193e65422b7f0355d4afb445e0a8b2cc3 # v0
        id: docker-build-push
        with:
          team: paw
          salsa: ${{ github.ref == 'refs/heads/main' }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  update-manifest-dev:
    uses: navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@67dc876fb9e1a0b115e47a36fd46a1c7b0064d4c # main
    needs: build
    permissions:
      contents: "read"
      packages: "read"
    with:
      id: "aia-min-side"
      url: "http://aia-min-side-ssr.paw"
      appname: "aia-min-side-ssr"
      namespace: "paw"
      cluster: dev-gcp
      commitmsg: ${{ github.event.head_commit.message}}
      fallback: "fallback"
      ssr: true
    secrets: inherit

  update-manifest-prod:
   if: github.ref == 'refs/heads/main'
   uses: navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@67dc876fb9e1a0b115e47a36fd46a1c7b0064d4c # main
   needs: build
   permissions:
     contents: "read"
     packages: "read"
   with:
     id: "aia-min-side"
     url: "http://aia-min-side-ssr.paw"
     appname: "aia-min-side-ssr"
     namespace: "paw"
     cluster: prod-gcp
     commitmsg: ${{ github.event.head_commit.message}}
     fallback: "fallback"
     ssr: true
   secrets: inherit

  deploy-dev:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build, update-manifest-dev]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Deploy to dev"
        uses: "nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb" # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp/nais.yaml
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}

  deploy-prod:
   if: github.ref == 'refs/heads/main'
   runs-on: "ubuntu-latest"
   timeout-minutes: 10
   permissions:
     contents: "read"
     id-token: "write"
   needs: [build, update-manifest-prod]

   steps:
     - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
     - name: "Deploy to prod"
       uses: "nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb" # v2
       env:
         CLUSTER: prod-gcp
         RESOURCE: nais/prod-gcp/nais.yaml
         VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}
