name: "Deploy dev&prod"
on:
  push:
    branches:
      - "main"
      - "dev/*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "test & build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"

    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - uses: "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
      - uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
        with:
          node-version: 24.16.0
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"

      - name: "Install dependencies"
        run: "pnpm install --frozen-lockfile --ignore-scripts"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: "Install playwright browsers"
        run: "pnpm exec playwright install chromium --with-deps"

      - name: "Run Biome lint"
        run: "pnpm run lint:ci"

      - name: "Run tests"
        run: "pnpm run test:ci"

      - name: Knip
        run: pnpm dlx knip --no-exit-code --reporter=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: "Build application"
        run: "pnpm run build"
        env:
          ASTRO_KEY: ${{ secrets.ASTRO_KEY }}

      - name: "Build storybook"
        run: "pnpm run build-storybook"

      - name: "Upload to cdn"
        uses: nais/deploy/actions/cdn-upload/v2@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb # v2
        with:
          team: paw
          source: ./dist/client/_astro
          destination: "aia-min-side-ssr"

      - name: "Build and push"
        uses: nais/docker-build-push@751a312f0803eb96a05a41fadf51be19b7be362c # v0
        id: docker-build-push
        with:
          team: paw
          salsa: ${{ github.ref == 'refs/heads/main' }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  update-manifest-dev:
    uses: navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@67dc876fb9e1a0b115e47a36fd46a1c7b0064d4c # main
    needs: build
    permissions:
      contents: "read"
      packages: "read"
    with:
      id: "aia-min-side"
      url: "http://aia-min-side-ssr.paw"
      appname: "aia-min-side-ssr"
      namespace: "paw"
      cluster: dev-gcp
      commitmsg: ${{ github.event.head_commit.message}}
      fallback: "fallback"
      ssr: true
    secrets: inherit

  update-manifest-prod:
   if: github.ref == 'refs/heads/main'
   uses: navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@67dc876fb9e1a0b115e47a36fd46a1c7b0064d4c # main
   needs: build
   permissions:
     contents: "read"
     packages: "read"
   with:
     id: "aia-min-side"
     url: "http://aia-min-side-ssr.paw"
     appname: "aia-min-side-ssr"
     namespace: "paw"
     cluster: prod-gcp
     commitmsg: ${{ github.event.head_commit.message}}
     fallback: "fallback"
     ssr: true
   secrets: inherit

  deploy-dev:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build, update-manifest-dev]
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - name: "Deploy to dev"
        uses: "nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb" # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-gcp/nais.yaml
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}

  deploy-prod:
   if: github.ref == 'refs/heads/main'
   runs-on: "ubuntu-latest"
   timeout-minutes: 10
   permissions:
     contents: "read"
     id-token: "write"
   needs: [build, update-manifest-prod]

   steps:
     - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
     - name: "Deploy to prod"
       uses: "nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb" # v2
       env:
         CLUSTER: prod-gcp
         RESOURCE: nais/prod-gcp/nais.yaml
         VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}
